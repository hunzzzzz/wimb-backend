<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333;">
<div style="max-width: 600px; margin: 0 auto; padding: 20px; border: 1px solid #ddd; border-radius: 10px;">
    <h2 style="color: #4A90E2;">WhatsInMyBrain 인증번호 안내</h2>
    <p>안녕하세요! 요청하신 인증번호를 안내해 드립니다.</p>
    <div style="background-color: #f9f9f9; padding: 15px; text-align: center; border-radius: 5px; margin: 20px 0;">
            <span style="font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #e67e22;"
                  th:text="${code}">123456</span>
    </div>
    <p>이 인증번호는 5분 동안 유효합니다.</p>
    <p>본인이 요청하지 않았다면 이 메일을 무시해 주세요.</p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <p style="font-size: 12px; color: #999;">WIMB - What's in my brain? | 나만의 개발일지</p>
</div>
</body>
</html>
